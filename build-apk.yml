name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www assets
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png icon-maskable-512.png family.jpg www/
          cp icon-1024.png assets/icon-only.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Create Android project
        run: |
          npx cap init "جاسوس‌خانه فرخی‌ها" com.farokhi.spy --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#17223A' --iconBackgroundColorDark '#17223A'
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk farokhi-spy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: farokhi-spy-apk
          path: farokhi-spy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: جاسوس‌خانه نسخه ${{ github.run_number }}
          files: farokhi-spy.apk
